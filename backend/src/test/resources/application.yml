spring:
  datasource:
    url: jdbc:h2:mem:skillora_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-junit-tests-min-32-characters-long
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
  seed:
    enabled: false
