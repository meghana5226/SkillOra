services:
  postgres:
    image: postgres:16-alpine
    container_name: skillora-postgres
    environment:
      POSTGRES_DB: skillora
      POSTGRES_USER: skillora
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-skillora}
    volumes:
      - skillora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillora -d skillora"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: skillora-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/skillora
      DATABASE_USERNAME: skillora
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-skillora}
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key-in-production-min-32-chars}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@1234}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: skillora-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  skillora_pgdata: